services:
  - type: web
    name: candletshop-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://candlet.shop,https://www.candlet.shop
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: MAIL_SMTP_USER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_SMTP_PORT
        value: 2525
      - key: MAIL_SMTP_SECURE
        value: false
      - key: MAIL_SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_NOTIFICATION_TO
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://api.candlet.shop/api/auth/google/callback
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        value: https://api.candlet.shop/api/auth/facebook/callback
      - key: PANCAKE_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
